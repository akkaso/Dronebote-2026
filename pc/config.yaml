# ── Fire Detection ──────────────────────────────────────────────
fire:
  # HSV range for orange/red/yellow fire colours (OpenCV scale: H 0-179, S/V 0-255)
  hsv_lower_orange: [5, 100, 100]
  hsv_upper_orange: [25, 255, 255]
  hsv_lower_red1:   [0, 100, 100]
  hsv_upper_red1:   [5, 255, 255]
  hsv_lower_red2:   [170, 100, 100]
  hsv_upper_red2:   [179, 255, 255]
  # Minimum contour area (pixels²) to count as a detection
  min_area: 2000
  # Consecutive frames required to confirm detection
  confirm_frames: 5

# ── ArUco Tracker ────────────────────────────────────────────────
aruco:
  # OpenCV ArUco dictionary: DICT_4X4_50 | DICT_5X5_100 | DICT_6X6_250 …
  dictionary: DICT_5X5_100
  # Dead-band: ignore offsets smaller than this value (pixels)
  dead_band: 20
  # Max consecutive frames without detection before STOP command
  lost_frames_limit: 10

# ── P-Controller ─────────────────────────────────────────────────
controller:
  # Proportional gain (maps pixel error → command duration in ms)
  kp: 0.05
  # Maximum command duration per cycle (ms)
  max_cmd_ms: 300

# ── Network ──────────────────────────────────────────────────────
network:
  pi_host: "192.168.1.100"
  pi_port: 5005

# ── Video source ─────────────────────────────────────────────────
video:
  # 0 = default webcam; use RTSP URL for drone stream
  source: 0
  width: 1280
  height: 720
