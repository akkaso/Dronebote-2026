# DroneBot 2026 – Configurazione lato PC
# I valori qui presenti sovrascrivono i default hardcoded in vision_client.py

# ── Rilevamento fuoco (HSV) ─────────────────────────────────────────
# Tonalità: 0-30 copre i colori arancione/rosso del fuoco
fire_hsv_lower: [0, 120, 120]
fire_hsv_upper: [30, 255, 255]
min_contour_area: 500        # pixel² – blob più piccoli vengono ignorati

# ── Guadagni PID ────────────────────────────────────────────────────
pid_kp: 0.8
pid_ki: 0.05
pid_kd: 0.1
pid_windup_limit: 300.0
pid_output_limit: 500.0

# ── Navigazione ─────────────────────────────────────────────────────
turn_threshold: 40           # px – entro questa soglia → va dritto
base_duration: 0.3           # s  – durata minima del comando

# ── WebSocket ───────────────────────────────────────────────────────
ws_url: "ws://localhost:8765"

# ── Sorgente video ──────────────────────────────────────────────────
camera_index: 0              # usato quando --source non è specificato

# ── Debug ───────────────────────────────────────────────────────────
debug_save: true             # salva i frame annotati in pc/debug/
display: true                # mostra la finestra OpenCV imshow

