# DroneBot 2026 – PC configuration
# All values here override the hard-coded defaults in vision_client.py

# ── Fire detection (HSV) ────────────────────────────────────────────
# Hue: 0-30 covers orange/red fire colours
fire_hsv_lower: [0, 120, 120]
fire_hsv_upper: [30, 255, 255]
min_contour_area: 500        # pixels² – smaller blobs are ignored

# ── PID gains ───────────────────────────────────────────────────────
pid_kp: 0.8
pid_ki: 0.05
pid_kd: 0.1
pid_windup_limit: 300.0
pid_output_limit: 500.0

# ── Navigation ──────────────────────────────────────────────────────
turn_threshold: 40           # px – inside this band → go forward
base_duration: 0.3           # s  – minimum command duration

# ── WebSocket ───────────────────────────────────────────────────────
ws_url: "ws://localhost:8765"

# ── Video source ────────────────────────────────────────────────────
camera_index: 0              # used when --source is not provided

# ── Debug ───────────────────────────────────────────────────────────
debug_save: true             # save annotated frames to pc/debug/
display: true                # show OpenCV imshow window
